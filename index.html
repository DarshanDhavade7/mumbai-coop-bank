<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mumbai Co-Op. Credit Society Limited</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
        }
        .bank-title {
            color: #800000;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .bank-sub {
            color: #002B49;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .reg-no {
            font-size: 11px;
            color: #666;
            margin-bottom: 20px;
        }
        .nav-tabs {
            display: flex;
            border-bottom: 2px solid #ddd;
            margin-bottom: 20px;
        }
        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #555;
            border-bottom: 3px solid transparent;
        }
        .tab.active {
            color: #800000;
            border-bottom: 3px solid #800000;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .input-box {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #800000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #600000;
        }
        .footer-text {
            font-size: 11px;
            color: #777;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="bank-title">दि मुंबई को-ऑपरेटिव्ह क्रेडिट सोसायटी लिमिटेड</div>
    <div class="bank-sub">THE MUMBAI CO-OP. CREDIT SOCIETY LIMITED</div>
    <div class="reg-no">नोंदणी क्र. बी. ओ. एम./डब्ल्यू. टी./आर एस आर/ सी. आर. /१३१४/ सन १९१९१-९२</div>

    <div class="nav-tabs">
        <div class="tab active" id="memberTab">👤 Member Login</div>
        <div class="tab" id="adminTab">⚙️ Staff / Admin</div>
    </div>

    <form id="portalLoginForm" onsubmit="return startLogin(event)">
        <div class="form-group">
            <label>Username / खाता क्रमांक</label>
            <input type="text" id="username" class="input-box" placeholder="Enter Username" required>
        </div>

        <div class="form-group">
            <label>Password / पासवर्ड</label>
            <input type="password" id="password" class="input-box" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="btn-submit">Login to Portal ➔</button>
    </form>

    <div class="footer-text">
        📍 Sector-22, Nerul (West), Navi Mumbai - 400706<br>
        © 2026 The Mumbai Co-Op. Credit Society Ltd.
    </div>
</div>

<script>
let currentRole = 'member';

document.getElementById('memberTab').onclick = function() {
    currentRole = 'member';
    this.classList.add('active');
    document.getElementById('adminTab').classList.remove('active');
};

document.getElementById('adminTab').onclick = function() {
    currentRole = 'admin';
    this.classList.add('active');
    document.getElementById('memberTab').classList.remove('active');
};

function startLogin(e) {
    if(e) e.preventDefault();
    var userVal = document.getElementById('username').value.trim();
    
    if (currentRole === 'admin' || userVal === 'admin') {
        window.location.href = 'admin-dashboard.html';
    } else {
        window.location.href = 'customer-dashboard.html';
    }
    return false;
}
</script>

</body>
</html>
