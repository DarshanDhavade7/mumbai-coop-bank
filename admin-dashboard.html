<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - The Mumbai Co-Op. Credit Society Ltd.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; }
        .navbar-theme { background-color: #d9232d; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-theme px-4 py-3 shadow">
        <span class="navbar-brand mb-0 h1 fw-bold">Admin Portal - The Mumbai Co-Op. Credit Society Ltd.</span>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">Logout</button>
    </nav>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-12">
                <div class="card shadow-sm p-4 bg-white rounded">
                    <h3 class="text-danger fw-bold mb-3">Welcome Admin!</h3>
                    <p class="text-muted">You are successfully logged into the Banking Management Portal.</p>
                    
                    <div class="row mt-4">
                        <div class="col-md-4">
                            <div class="card bg-primary text-white p-3 shadow-sm">
                                <h5>Total Customers</h5>
                                <h2>125</h2>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-success text-white p-3 shadow-sm">
                                <h5>Total Deposits</h5>
                                <h2>₹ 45,20,000</h2>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="card bg-warning text-dark p-3 shadow-sm">
                                <h5>Active Loans</h5>
                                <h2>18</h2>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('user');
            window.location.href = '/index.html';
        });
    </script>
</body>
</html>
